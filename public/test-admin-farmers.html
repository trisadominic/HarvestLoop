<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Farmers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl mb-4">Admin Farmers Test</h1>
    
    <div id="farmersTable" class="bg-white rounded-lg shadow">
        <div class="p-4">Loading farmers...</div>
    </div>
    
    <script>
        let token = localStorage.getItem('token') || sessionStorage.getItem('token');
        
        // Auto-login function for admin
        async function autoLoginAdmin() {
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@farmconnect.com',
                        password: 'admin123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.token;
                    localStorage.setItem('token', token);
                    console.log('✅ Auto-login successful');
                    loadFarmers();
                } else {
                    console.error('❌ Auto-login failed');
                }
            } catch (error) {
                console.error('❌ Auto-login error:', error);
            }
        }
        
        async function loadFarmers() {
            try {
                console.log('🔍 Loading farmers...');
                const response = await fetch('/api/admin/farmers', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const farmers = await response.json();
                    console.log('✅ Farmers loaded:', farmers);
                    displayFarmers(farmers);
                } else {
                    console.error('❌ Failed to load farmers');
                }
            } catch (error) {
                console.error('❌ Error loading farmers:', error);
            }
        }
        
        function displayFarmers(farmers) {
            const container = document.getElementById('farmersTable');
            
            if (farmers.length === 0) {
                container.innerHTML = '<div class="p-4">No farmers found</div>';
                return;
            }
            
            let html = `
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left">Name</th>
                            <th class="px-4 py-3 text-left">Email</th>
                            <th class="px-4 py-3 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            farmers.forEach(farmer => {
                html += `
                    <tr class="border-t">
                        <td class="px-4 py-3">${farmer.username || 'N/A'}</td>
                        <td class="px-4 py-3">${farmer.email || 'N/A'}</td>
                        <td class="px-4 py-3">
                            <button onclick="testViewPopup('${farmer._id}')" 
                                    class="bg-blue-500 text-white px-3 py-1 rounded mr-2">
                                View
                            </button>
                            <button onclick="testMorePopup('${farmer._id}')" 
                                    class="bg-gray-500 text-white px-3 py-1 rounded">
                                More
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function testViewPopup(farmerId) {
            console.log('🔍 View button clicked for farmer:', farmerId);
            alert(`View button clicked for farmer: ${farmerId}`);
            
            // Test the API call
            testFarmerAPI(farmerId);
        }
        
        function testMorePopup(farmerId) {
            console.log('⚙️ More button clicked for farmer:', farmerId);
            alert(`More button clicked for farmer: ${farmerId}`);
        }
        
        async function testFarmerAPI(farmerId) {
            try {
                console.log('🔍 Testing farmer API for ID:', farmerId);
                const response = await fetch(`/api/admin/farmers/${farmerId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const farmer = await response.json();
                    console.log('✅ Farmer details:', farmer);
                } else {
                    console.error('❌ Failed to load farmer details');
                }
            } catch (error) {
                console.error('❌ Error loading farmer details:', error);
            }
        }
        
        // Initialize
        if (!token) {
            autoLoginAdmin();
        } else {
            loadFarmers();
        }
    </script>
</body>
</html>
