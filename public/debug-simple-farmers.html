<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Admin Farmers - Simple Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .farmer-card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .view-btn { background: #007bff; color: white; border: none; border-radius: 4px; }
        .edit-btn { background: #28a745; color: white; border: none; border-radius: 4px; }
        .more-btn { background: #6c757d; color: white; border: none; border-radius: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; min-width: 400px; }
        .close { float: right; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>
    <h1>Debug Admin Farmers - Simple Test</h1>
    <div id="status">Loading...</div>
    <div id="farmers-container"></div>
    
    <!-- Simple Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        
        async function autoLogin() {
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@farmconnect.com',
                        password: 'admin123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.token;
                    localStorage.setItem('token', token);
                    console.log('✅ Auto-login successful');
                    loadFarmers();
                } else {
                    document.getElementById('status').innerText = 'Login failed';
                }
            } catch (error) {
                document.getElementById('status').innerText = 'Login error: ' + error.message;
            }
        }
        
        async function loadFarmers() {
            try {
                document.getElementById('status').innerText = 'Loading farmers...';
                
                const response = await fetch('/api/admin/farmers', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const farmers = await response.json();
                    document.getElementById('status').innerText = `Found ${farmers.length} farmers`;
                    displayFarmers(farmers);
                } else {
                    document.getElementById('status').innerText = 'Failed to load farmers';
                }
            } catch (error) {
                document.getElementById('status').innerText = 'Error: ' + error.message;
            }
        }
        
        function displayFarmers(farmers) {
            const container = document.getElementById('farmers-container');
            container.innerHTML = '';
            
            farmers.forEach(farmer => {
                const farmerCard = document.createElement('div');
                farmerCard.className = 'farmer-card';
                
                farmerCard.innerHTML = `
                    <h3>${farmer.username || 'N/A'}</h3>
                    <p>Email: ${farmer.email || 'N/A'}</p>
                    <p>Phone: ${farmer.phone || 'N/A'}</p>
                    <p>Farm: ${farmer.farmName || 'N/A'}</p>
                    <div>
                        <button class="view-btn" onclick="testViewDetails('${farmer._id}')">View Details</button>
                        <button class="edit-btn" onclick="testEditFarmer('${farmer._id}')">Edit</button>
                        <button class="more-btn" onclick="testMoreActions('${farmer._id}')">More Actions</button>
                    </div>
                `;
                
                container.appendChild(farmerCard);
            });
        }
        
        function testViewDetails(farmerId) {
            console.log('🔍 View Details clicked for:', farmerId);
            document.getElementById('modal-content').innerHTML = `
                <h2>View Details</h2>
                <p>Farmer ID: ${farmerId}</p>
                <p>Testing view details functionality...</p>
                <button onclick="loadFarmerDetails('${farmerId}')">Load Full Details</button>
            `;
            document.getElementById('modal').style.display = 'block';
        }
        
        function testEditFarmer(farmerId) {
            console.log('✏️ Edit clicked for:', farmerId);
            document.getElementById('modal-content').innerHTML = `
                <h2>Edit Farmer</h2>
                <p>Farmer ID: ${farmerId}</p>
                <p>Testing edit functionality...</p>
            `;
            document.getElementById('modal').style.display = 'block';
        }
        
        function testMoreActions(farmerId) {
            console.log('⚙️ More Actions clicked for:', farmerId);
            document.getElementById('modal-content').innerHTML = `
                <h2>More Actions</h2>
                <p>Farmer ID: ${farmerId}</p>
                <p>Testing more actions functionality...</p>
                <ul>
                    <li>View Products</li>
                    <li>View Negotiations</li>
                    <li>View Analytics</li>
                    <li>Toggle Status</li>
                    <li>Delete Farmer</li>
                </ul>
            `;
            document.getElementById('modal').style.display = 'block';
        }
        
        async function loadFarmerDetails(farmerId) {
            try {
                console.log('📋 Loading farmer details for:', farmerId);
                
                const response = await fetch(`/api/admin/farmers/${farmerId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const farmer = await response.json();
                    console.log('✅ Farmer details loaded:', farmer);
                    
                    document.getElementById('modal-content').innerHTML = `
                        <h2>Farmer Details</h2>
                        <p><strong>Name:</strong> ${farmer.username || 'N/A'}</p>
                        <p><strong>Email:</strong> ${farmer.email || 'N/A'}</p>
                        <p><strong>Phone:</strong> ${farmer.phone || 'N/A'}</p>
                        <p><strong>Farm Name:</strong> ${farmer.farmName || 'N/A'}</p>
                        <p><strong>Farm Address:</strong> ${farmer.farmAddress || 'N/A'}</p>
                        <p><strong>Products:</strong> ${farmer.productCount || 0}</p>
                        <p><strong>Orders:</strong> ${farmer.orderCount || 0}</p>
                        <p><strong>Join Date:</strong> ${farmer.joinDate ? new Date(farmer.joinDate).toLocaleDateString() : 'N/A'}</p>
                    `;
                } else {
                    document.getElementById('modal-content').innerHTML = `
                        <h2>Error</h2>
                        <p>Failed to load farmer details. Status: ${response.status}</p>
                    `;
                }
            } catch (error) {
                console.error('❌ Error loading farmer details:', error);
                document.getElementById('modal-content').innerHTML = `
                    <h2>Error</h2>
                    <p>Error loading farmer details: ${error.message}</p>
                `;
            }
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
        
        // Initialize
        if (!token) {
            autoLogin();
        } else {
            loadFarmers();
        }
    </script>
</body>
</html>
